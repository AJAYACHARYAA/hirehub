<!doctype html>
<html>
  <head>
    <title>OTP Test</title>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }
      .success {
        color: green;
      }
      .error {
        color: red;
      }
      input,
      button {
        margin: 10px;
        padding: 10px;
        font-size: 16px;
      }
      .otp-input {
        width: 50px;
        text-align: center;
        font-size: 20px;
        margin: 5px;
      }
      #log {
        background: #f0f0f0;
        padding: 10px;
        margin-top: 20px;
        font-family: monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>🔧 HireHub OTP Test</h1>

    <div>
      <h2>Test Backend Connection</h2>
      <button onclick="testBackend()">Test Backend Connection</button>
      <div id="testResult"></div>
    </div>

    <div>
      <h2>Mobile OTP Test</h2>
      <input
        type="text"
        id="mobile"
        placeholder="Mobile Number"
        maxlength="10"
        value="9876543210"
      />
      <button onclick="sendOTP()">Send OTP</button>
      <br />
      <div id="otpSection" style="display: none">
        <div class="otp-container">
          <input
            type="text"
            maxlength="1"
            class="otp-input"
            oninput="moveNext(this)"
            onkeydown="moveBack(event, this)"
          />
          <input
            type="text"
            maxlength="1"
            class="otp-input"
            oninput="moveNext(this)"
            onkeydown="moveBack(event, this)"
          />
          <input
            type="text"
            maxlength="1"
            class="otp-input"
            oninput="moveNext(this)"
            onkeydown="moveBack(event, this)"
          />
          <input
            type="text"
            maxlength="1"
            class="otp-input"
            oninput="moveNext(this)"
            onkeydown="moveBack(event, this)"
          />
        </div>
        <button onclick="verifyOTP()">Verify OTP</button>
      </div>
      <p id="result"></p>
    </div>

    <div id="log">
      <strong>Console Log:</strong><br />
      Waiting for actions...
    </div>

    <script>
      const BACKEND_URL = "http://localhost:5000";

      function addLog(msg) {
        const logDiv = document.getElementById("log");
        logDiv.innerHTML += `<br>${new Date().toLocaleTimeString()}: ${msg}`;
        console.log(msg);
      }

      async function testBackend() {
        addLog("Testing backend connection...");
        try {
          const response = await fetch(`${BACKEND_URL}/`);
          const data = await response.json();
          addLog(`✅ Backend response: ${JSON.stringify(data)}`);
          document.getElementById("testResult").innerHTML =
            '<span class="success">✅ Backend is running!</span>';
        } catch (error) {
          addLog(`❌ Backend not reachable: ${error.message}`);
          document.getElementById("testResult").innerHTML =
            '<span class="error">❌ Backend not running! Start with: node server.js</span>';
        }
      }

      async function sendOTP() {
        const mobile = document.getElementById("mobile").value;
        if (!mobile || mobile.length !== 10) {
          addLog("❌ Invalid mobile number");
          alert("Enter 10-digit mobile number");
          return;
        }

        addLog(`📱 Sending OTP to ${mobile}...`);

        try {
          const response = await fetch(`${BACKEND_URL}/send-mobile-otp`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mobile }),
          });

          const data = await response.json();
          addLog(`📦 Response: ${JSON.stringify(data)}`);

          if (data.success) {
            addLog(`✅ OTP sent successfully! Demo OTP: ${data.demoOtp}`);
            document.getElementById("otpSection").style.display = "block";
            document.getElementById("result").innerHTML =
              `<span class="success">✅ OTP sent! Demo OTP: ${data.demoOtp}</span>`;
            alert(`Demo OTP: ${data.demoOtp}\nCheck backend console also!`);
          } else {
            addLog(`❌ Failed: ${data.error}`);
            document.getElementById("result").innerHTML =
              `<span class="error">❌ Failed: ${data.error}</span>`;
          }
        } catch (error) {
          addLog(`❌ Network error: ${error.message}`);
          document.getElementById("result").innerHTML =
            `<span class="error">❌ Cannot connect to backend. Make sure server is running on port 5000</span>`;
        }
      }

      async function verifyOTP() {
        const mobile = document.getElementById("mobile").value;
        const inputs = document.querySelectorAll(".otp-input");
        const otp = Array.from(inputs)
          .map((i) => i.value)
          .join("");

        if (otp.length !== 4) {
          addLog("❌ Please enter complete 4-digit OTP");
          alert("Enter complete OTP");
          return;
        }

        addLog(`🔍 Verifying OTP: ${otp} for mobile: ${mobile}`);

        try {
          const response = await fetch(`${BACKEND_URL}/verify-mobile-otp`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mobile, otp }),
          });

          const data = await response.json();
          addLog(`📦 Response: ${JSON.stringify(data)}`);

          if (data.success) {
            addLog(`✅ OTP verified successfully!`);
            document.getElementById("result").innerHTML =
              '<span class="success">✅ OTP Verified! Login successful!</span>';
            alert("OTP Verified! Login successful!");
          } else {
            addLog(`❌ Invalid OTP`);
            document.getElementById("result").innerHTML =
              '<span class="error">❌ Invalid OTP. Try again!</span>';
          }
        } catch (error) {
          addLog(`❌ Verification error: ${error.message}`);
          document.getElementById("result").innerHTML =
            `<span class="error">❌ Error: ${error.message}</span>`;
        }
      }

      function moveNext(el) {
        if (el.value.length === 1 && el.nextElementSibling) {
          el.nextElementSibling.focus();
        }
      }

      function moveBack(e, el) {
        if (e.key === "Backspace" && !el.value && el.previousElementSibling) {
          el.previousElementSibling.focus();
        }
      }

      // Auto-test backend on page load
      setTimeout(testBackend, 1000);
    </script>
  </body>
</html>
